<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>เว็บโปรไฟล์ของฉัน - พลธกานต์</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #eef2ff 0%, #f8fafc 50%, #e0f2fe 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      color: #1e293b;
    }

    .profile-card {
      width: 100%;
      max-width: 480px;
      background-color: #ffffff;
      border-radius: 18px;
      padding: 32px;
      box-shadow: 0 14px 35px rgba(15, 23, 42, 0.1);
      border: 1px solid #e2e8f0;
    }

    .badge {
      display: inline-block;
      background-color: #dbeafe;
      color: #1d4ed8;
      font-size: 0.85rem;
      font-weight: 600;
      padding: 4px 12px;
      border-radius: 999px;
      margin-bottom: 12px;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 1.85rem;
      color: #0f172a;
    }

    p {
      margin: 0 0 24px;
      font-size: 1rem;
      line-height: 1.6;
      color: #475569;
    }

    ul {
      list-style: none;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    li {
      background-color: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 12px;
      padding: 12px 16px;
      font-size: 0.98rem;
    }

    li strong {
      color: #0f172a;
    }
  </style>
</head>
<body>
  <main class="profile-card">
    <span class="badge">GitHub Profile</span>
    <h1>สวัสดีครับ</h1>
    <p>นี่คือเว็บโปรไฟล์ของฉันบน GitHub</p>
    <ul>
      <li><strong>ชื่อเล่น:</strong> แคป</li>
      <li><strong>สิ่งที่กำลังเรียน:</strong> GitHub Desktop</li>
      <li><strong>สถานศึกษา:</strong> วิทยาลัยเทคนิคสมุทรปราการ (ปวส.)</li>
    </ul>
  </main>
</body>
</html>
