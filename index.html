<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>เว็บโปรไฟล์ของฉัน - พลธกานต์</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      font-family: "Segoe UI", Tahoma, sans-serif;
      background: radial-gradient(circle at top, #1c1a15 0%, #09090b 65%, #050505 100%);
      color: #f3f4f6;
      margin: 0;
      min-height: 100vh;
      padding: 40px 16px;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .card {
      background: linear-gradient(145deg, #161618 0%, #0e0e10 100%);
      max-width: 500px;
      width: 100%;
      padding: 36px 32px;
      border-radius: 20px;
      border: 1px solid rgba(212, 175, 55, 0.35);
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.75), 0 0 25px rgba(212, 175, 55, 0.12);
      position: relative;
      overflow: hidden;
    }

    .card::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 4px;
      background: linear-gradient(90deg, #8a6d1c, #f3e5ab, #d4af37, #8a6d1c);
    }

    .greeting {
      text-align: center;
      margin-bottom: 24px;
      padding-bottom: 20px;
      border-bottom: 1px solid rgba(212, 175, 55, 0.2);
    }

    h1 {
      margin: 0 0 6px;
      font-size: 1.9rem;
      background: linear-gradient(90deg, #f3e5ab 0%, #d4af37 50%, #b8860b 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      letter-spacing: 0.5px;
    }

    .subtitle {
      margin: 0;
      color: #9ca3af;
      font-size: 0.95rem;
    }

    .profile-header {
      text-align: center;
      margin-bottom: 24px;
    }

    .profile-header img {
      width: 115px;
      height: 115px;
      object-fit: cover;
      border-radius: 50%;
      border: 3px solid #d4af37;
      box-shadow: 0 0 20px rgba(212, 175, 55, 0.3);
      margin-bottom: 14px;
    }

    #profile-name {
      margin: 0 0 8px;
      font-size: 1.45rem;
      color: #fef3c7;
      font-weight: 600;
    }

    .bio {
      margin: 0;
      color: #d1d5db;
      font-size: 0.95rem;
      line-height: 1.6;
    }

    .info-list {
      list-style: none;
      padding: 0;
      margin: 0 0 24px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .info-list li {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(212, 175, 55, 0.22);
      border-left: 3px solid #d4af37;
      padding: 11px 16px;
      border-radius: 10px;
      color: #e5e7eb;
      font-size: 0.95rem;
    }

    .info-list li strong {
      color: #f3e5ab;
    }

    h3 {
      margin: 0 0 12px;
      font-size: 1.1rem;
      color: #d4af37;
      letter-spacing: 0.5px;
    }

    .skills-list {
      list-style: none;
      padding: 0;
      margin: 0;
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    .skills-list li {
      background: linear-gradient(135deg, rgba(212, 175, 55, 0.18), rgba(184, 134, 11, 0.08));
      border: 1px solid rgba(212, 175, 55, 0.45);
      color: #fef3c7;
      padding: 6px 16px;
      border-radius: 999px;
      font-size: 0.9rem;
      font-weight: 500;
    }
  </style>
</head>
<body>
  <main class="card">
    <header class="greeting">
      <h1>สวัสดีครับ</h1>
      <p class="subtitle">นี่คือเว็บโปรไฟล์ของฉันบน GitHub</p>
    </header>

    <section class="profile-header">
      <img src="30963b11-1765-48fc-9424-b58d1a6b18a9.jpg" alt="รูปโปรไฟล์ตัวอย่าง">
      <h2 id="profile-name">พลธกานต์ ผดุงพล</h2>
      <p class="bio">นักพัฒนาเว็บไซต์ที่ชื่นชอบการเรียนรู้สิ่งใหม่ๆ และรักการดื่มกาแฟ</p>
    </section>

    <ul class="info-list">
      <li><strong>ชื่อเล่น:</strong> แคป</li>
      <li><strong>สิ่งที่กำลังเรียน:</strong> GitHub Desktop</li>
      <li><strong>สาขา/ระดับชั้น:</strong> ปวส. เทคโนโลยีสารสนเทศ</li>
    </ul>

    <section>
      <h3>ทักษะของฉัน</h3>
      <ul class="skills-list">
        <li>HTML</li>
        <li>CSS</li>
        <li>JavaScript</li>
      </ul>
    </section>
  </main>
</body>
</html>
